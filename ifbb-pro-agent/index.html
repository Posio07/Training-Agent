<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23272B">
  <meta name="description" content="Agente de entrenamiento: plan de entrenamiento, dieta y medidas objetivo (incluye divisiones estilo IFBB Pro) basados en evidencia científica citada. Funciona sin conexión y guarda varios perfiles.">
  <title>Training Agent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Sprite de íconos propio: grilla 24px, trazo 2px, currentColor. Sin
       librerías de íconos externas. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="icon-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></symbol>
      <symbol id="icon-tape" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v2M21 12h-2"/></symbol>
      <symbol id="icon-barbell" viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M5 12h14"/><rect x="4" y="7" width="3" height="10" rx="1"/><rect x="17" y="7" width="3" height="10" rx="1"/></symbol>
      <symbol id="icon-trend-down" viewBox="0 0 24 24"><path d="M3 6l6.5 6.5 4-4L21 16"/><circle cx="21" cy="16" r="1.4" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6c-2.2-1.3-4.8-1.5-9-1v14c4.2-.5 6.8-.3 9 1 2.2-1.3 4.8-1.5 9-1V5c-4.2-.5-6.8-.3-9 1z"/><path d="M12 6v14"/><path d="M16 3v6l-1.6-1.2L13 9V3z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 3.2"/></symbol>
      <symbol id="icon-gauge" viewBox="0 0 24 24"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4-5.2"/><circle cx="12" cy="17" r="1.2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4.5A2.5 2.5 0 0 0 7 9.5M17 5h2.5A2.5 2.5 0 0 1 17 9.5"/><path d="M12 13v4M8.5 21h7M9.5 17h5v4h-5z"/></symbol>
      <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="icon-arrow-flat" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="icon-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <div>
        <h1>Training Agent</h1>
        <p id="active-profile-label">Sin perfil activo</p>
      </div>
    </div>
    <button id="btn-install" class="btn btn-ghost" hidden>Instalar</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="profiles" class="tab active" aria-label="Perfiles"><svg class="icon" aria-hidden="true"><use href="#icon-person"></use></svg><span>Perfiles</span></button>
    <button data-tab="data" class="tab" aria-label="Datos"><svg class="icon" aria-hidden="true"><use href="#icon-tape"></use></svg><span>Datos</span></button>
    <button data-tab="plan" class="tab" aria-label="Plan"><svg class="icon" aria-hidden="true"><use href="#icon-barbell"></use></svg><span>Plan</span></button>
    <button data-tab="progress" class="tab" aria-label="Progreso"><svg class="icon" aria-hidden="true"><use href="#icon-trend-down"></use></svg><span>Progreso</span></button>
    <button data-tab="sources" class="tab" aria-label="Fuentes"><svg class="icon" aria-hidden="true"><use href="#icon-book"></use></svg><span>Fuentes</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/exerciseMuscles.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/exerciseImages.js"></script>
  <script src="js/sessionStore.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
