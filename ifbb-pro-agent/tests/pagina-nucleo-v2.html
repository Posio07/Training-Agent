<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Página de prueba · núcleo v2 (se borra en el corte)</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Página de prueba de las pantallas del núcleo nuevo (B-039, paso 3.6). No es parte de la app: monta perfil y plan sobre un almacenamiento en
       memoria, sin tocar los datos reales. El sprite de íconos se toma de index.html para no duplicarlo. Se borra en el corte. -->
  <div id="sprite" aria-hidden="true"></div>
  <header class="topbar"><div class="brand"><div><h1>Núcleo v2 · prueba</h1><p id="estado">En memoria</p></div></div></header>
  <main id="view" class="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../js/exerciseMuscles.js"></script>
  <script src="../js/perfilArticular.js"></script>
  <script src="../js/knowledge.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/exerciseImages.js"></script>
  <script src="../js/sessionStore.js"></script>
  <script src="../js/core-v2/registro.js"></script>
  <script src="../js/core-v2/perfilArticularVariantes.js"></script>
  <script src="../js/core-v2/catalogo.js"></script>
  <script src="../js/core-v2/reparto.js"></script>
  <script src="../js/core-v2/plan.js"></script>
  <script src="../js/core-v2/almacen.js"></script>
  <script src="../js/core-v2/aviso.js"></script>
  <script src="../js/core-v2/sesion.js"></script>
  <script src="../js/core-v2/dolor.js"></script>
  <script src="../js/core-v2/textos.js"></script>
  <script src="../js/core-v2/cardio.js"></script>
  <script src="../js/core-v2/pantallas/comun.js"></script>
  <script src="../js/core-v2/pantallas/editor.js"></script>
  <script src="../js/core-v2/pantallas/perfil.js"></script>
  <script src="../js/core-v2/pantallas/entreno.js"></script>
  <script src="../js/core-v2/pantallas/sesion.js"></script>
  <script src="../js/core-v2/pantallas/progreso.js"></script>
  <script src="../js/core-v2/pantallas/montaje.js"></script>
  <script>
    // Sprite de íconos de la app real.
    fetch('../index.html').then(r => r.text()).then(t => { const m = t.match(/<svg width="0"[\s\S]*?<\/svg>/); if (m) document.getElementById('sprite').innerHTML = m[0]; });
    let n = 0;
    // El almacenamiento definitivo (core-v2/almacen.js), el mismo que usa la app en el corte, sobre el localStorage real pero con una clave de PRUEBA para no tocar
    // ni los datos de la app actual ni los futuros de la definitiva. Si el navegador no lo permite, queda en memoria.
    const CLAVE_PRUEBA = CORE_V2_ALMACEN.CLAVE + ':prueba';
    const respaldo = {}; const mem0 = { getItem: k => (k in respaldo ? respaldo[k] : null), setItem: (k, v) => { respaldo[k] = String(v); } };
    const disco = (() => { try { localStorage.setItem('__p', '1'); localStorage.removeItem('__p'); return localStorage; } catch (e) { return mem0; } })();
    const almacen = CORE_V2_ALMACEN.cargar(disco, CLAVE_PRUEBA);
    window.__claveAlmacen = CLAVE_PRUEBA;
    window.__almacen = almacen; // para que las pruebas de punta a punta lo lean
    window.__sesionesIniciadas = [];
    let t;
    // Almacenamiento de la sesión en curso en memoria (la app real usa localStorage).
    const mem = {}; const storage = { getItem: k => (k in mem ? mem[k] : null), setItem: (k, v) => { mem[k] = String(v); }, removeItem: k => { delete mem[k]; } };
    window.__storage = mem;
    const confirmar = msg => Promise.resolve(window.__confirmar === undefined ? window.confirm(msg) : window.__confirmar);
    const aviso = msg => { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(t); t = setTimeout(() => el.classList.remove('show'), 2600); };
    const sesion = CORE_V2_SESION_PANTALLA.crearSesion({ doc: document, storage, perfiles: () => almacen.profiles, guardar: () => CORE_V2_ALMACEN.guardar(disco, almacen, CLAVE_PRUEBA), ahora: () => '2026-11-09', reloj: () => Date.now() + (window.__reloj || 0), id: () => 'ses' + (++n), aviso, confirmar, alTerminar: () => window.__montaje.ir('plan') });
    window.__sesion = sesion;
    window.__montaje = CORE_V2_MONTAJE.montar(document.getElementById('view'), {
      almacen,
      guardar: () => CORE_V2_ALMACEN.guardar(disco, almacen, CLAVE_PRUEBA),
      reloj: () => Date.now(),
      sesionActivaId: () => { const s = sesion.estado(); return s ? s.sessionId : null; },
      ahora: () => '2026-11-09',
      id: () => 'id' + (++n),
      aviso,
      confirmar,
      pantallaBloqueo: (raiz, p, salud) => { raiz.innerHTML = '<div class="card" id="bloqueo"><h2>Plan en pausa</h2><p>' + (salud.blockReason || salud.injuryBlockReason || '') + '</p></div>'; window.__bloqueos = (window.__bloqueos || 0) + 1; },
      alIniciarSesion: (i, p, min) => { window.__sesionesIniciadas.push(i); sesion.iniciar(p, i, min); },
    });
  </script>
</body>
</html>
