<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120C0A">
<title>Fundición · mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;800&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<!-- Calima: el aire caliente deforma lo que está al rojo. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="calima" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence id="calima-ruido" type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="3" result="r"/>
  <feDisplacementMap in="SourceGraphic" in2="r" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<main id="escena"></main>
<canvas id="foso" aria-hidden="true"></canvas>      <!-- el foso: los discos de cada serie, con gravedad -->
<div id="enfriado" hidden></div>                    <!-- descanso -->
<div id="crisol" hidden></div>                      <!-- llega el top set -->
<div id="placa" hidden></div>                       <!-- récord -->
<div id="colada" aria-hidden="true"></div>          <!-- transición: metal fundido que baja -->
<canvas id="chispas" aria-hidden="true"></canvas>   <!-- chispas, brasas y vapor -->
<div id="aviso" role="status"></div>

<script src="../comun/datos.js"></script>
<script src="../comun/motor.js"></script>
<script src="../comun/sonido.js"></script>
<script src="../comun/menu.js"></script>
<script src="mock.js"></script>
</body>
</html>
